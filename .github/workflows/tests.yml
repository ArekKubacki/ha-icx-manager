name: Tests
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - run: python -m compileall -q custom_components/icx_manager
      - run: python -m pytest -q tests
