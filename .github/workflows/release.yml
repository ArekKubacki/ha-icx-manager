name: Publish numbered release
on:
  push:
    branches: [main]
    paths:
      - "custom_components/icx_manager/manifest.json"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release for manifest version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('custom_components/icx_manager/manifest.json', 'utf8'));
            const version = data.version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) core.setFailed('Invalid semver: ' + version);
            else {
              const tag = 'v' + version;
              const {owner, repo} = context.repo;
              try {
                await github.rest.repos.getReleaseByTag({owner, repo, tag});
                core.info(tag + ' already published');
              } catch(e) {
                if (e.status !== 404) throw e;
                await github.rest.repos.createRelease({
                  owner, repo, tag_name: tag, target_commitish: context.sha,
                  name: 'ICX Manager ' + tag,
                  body: [
                    'ICX Manager ' + tag,
                    '',
                    '- SNMP switch Online status and active physical link count.',
                    '- Active downlink count with configurable uplink and exclusions.',
                    '- Direct RX/TX throughput from the chosen uplink, in Mbit/s.',
                    '- All previous per-port administration, protection and PoE controls retained.',
                    '',
                    'Install or update from HACS, then restart Home Assistant.'
                  ].join('\n'),
                  draft: false, prerelease: false, generate_release_notes: true
                });
                core.info('Published ' + tag);
              }
            }
